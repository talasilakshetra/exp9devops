apiVersion: apps/v1
kind: Deployment
metadata:
  name: 24wh1a05l8-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 24wh1a05l8-app
  template:
    metadata:
      labels:
        app: 24wh1a05l8-app
    spec:
      containers:
        - name: 24wh1a05l8-app
          image: 24wh1a05l8-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: app-storage
              mountPath: /app/data
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: 24wh1a05l8-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 24wh1a05l8-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: 24wh1a05l8-service
spec:
  type: NodePort
  selector:
    app: 24wh1a05l8-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080